version: 1
project:
  title: Jupyterbook template
  authors:
    - name: The Copernicus Climate Change Service (C3S)
    - name: entrusted to ECMWF (European Centre for Medium-Range Weather Forecasts)
  exclude:
    - developer/*
  github: ecmwf-training/c3s-training-submodule-climate-indices
  thebe:
    binder:
      repo: ecmwf-training/c3s-training-submodule-climate-indices
      provider: github
      url: https://mybinder.org
      ref: develop
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: intro.md
    - file: ci-windchill.ipynb
      title: Windchill
    - file: gtsmip-water-levels.ipynb
      title: Exploring coastal water levels
    - file: warm-and-wet-days-indicator.ipynb
      title: Warm & wet days indicator
    - file: energy-degree-days-indicator.ipynb
site:
  options:
    folders: true
  template: book-theme
